name: Build and deploy Python project to Azure Function App - bumbleextract

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 1. Instalar dependencias en la carpeta local que exige Azure Flex Consumption
      - name: Install dependencies
        run: |
          mkdir -p .python_packages/lib/site-packages
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      # 2. Empaquetar todo correctamente en un ZIP (incluyendo .python_packages)
      - name: Zip artifact for deployment
        run: |
          zip -r deployment.zip . -x "*.git*" "venv/*" ".github/*"

      # 3. Autenticación en Azure con OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Despliegue del paquete ZIP empaquetado
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: 'bumbleextract'
          package: 'deployment.zip'